[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "deciform"
version = "0.0.1"
description = "Compile JSON Schema into typed System One decisions — schema-guaranteed objects with per-field calibrated confidence"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5",
    "httpx>=0.27",
]

[project.optional-dependencies]
local = ["torch>=2.2", "transformers>=4.45"]
eval = ["datasets>=3.0,<4.0", "matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["deciform"]

[tool.ruff]
line-length = 100
